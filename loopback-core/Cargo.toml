[package]
name = "loopback-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "sync", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
