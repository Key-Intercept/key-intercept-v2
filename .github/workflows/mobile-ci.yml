name: Mobile CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_DEBUG_APK_NAME: key-intercept-loopback-android-debug.apk
  IOS_IPA_NAME: key-intercept-loopback-ios.ipa

jobs:
  build-android-loopback:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: mobile/android-loopback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: |
          gradle :app:assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/${ANDROID_DEBUG_APK_NAME}

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-loopback-android-debug
          path: dist/${ANDROID_DEBUG_APK_NAME}

  build-ios-loopback:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios-loopback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app archive
        run: |
          xcodebuild \
            -project KeyInterceptLoopback.xcodeproj \
            -scheme KeyInterceptLoopback \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/KeyInterceptLoopback.xcarchive \
            archive

      - name: Package sideloadable IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/KeyInterceptLoopback.xcarchive/Products/Applications/KeyInterceptLoopback.app build/Payload/
          (cd build && zip -qry ${IOS_IPA_NAME} Payload)

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-loopback-ios
          path: mobile/ios-loopback/build/${{ env.IOS_IPA_NAME }}
