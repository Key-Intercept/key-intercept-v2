name: Mobile CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-loopback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android-loopback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: gradle :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-loopback-android-debug
          path: mobile/android-loopback/app/build/outputs/apk/debug/app-debug.apk

  build-ios-loopback:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios-loopback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project KeyInterceptLoopback.xcodeproj \
            -scheme KeyInterceptLoopback \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
