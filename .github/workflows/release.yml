name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      tag_created: ${{ steps.version.outputs.tag_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing_tag="$(git tag --points-at HEAD 'v*' | sort -V | tail -n1 || true)"
          if [[ -n "$existing_tag" ]]; then
            release_tag="$existing_tag"
            tag_created="false"
          else
            latest_tag="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="$(( ${BASH_REMATCH[3]} + 1 ))"
              release_tag="v${major}.${minor}.${patch}"
            else
              release_tag="v0.1.0"
            fi
            git tag "$release_tag"
            tag_created="true"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "tag_created=$tag_created" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.version.outputs.tag_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin "refs/tags/${RELEASE_TAG}"

  build-loopback-and-plugin:
    runs-on: ${{ matrix.os }}
    needs: determine-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            loopback_artifact_suffix: linux
          - os: windows-latest
            loopback_artifact_suffix: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build loopback server
        run: cargo build --release -p loopback-server

      - name: Collect loopback artifact (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/loopback-server dist/loopback-server

      - name: Upload loopback artifact (linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: loopback-server-${{ matrix.loopback_artifact_suffix }}-x86_64
          path: dist/loopback-server

      - name: Collect loopback artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/loopback-server.exe dist/loopback-server.exe

      - name: Upload loopback artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: loopback-server-${{ matrix.loopback_artifact_suffix }}-x86_64
          path: dist/loopback-server.exe

      - name: Collect plugin artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp plugin/keyInterceptSelfHosted.tsx dist/keyInterceptSelfHosted.tsx

      - name: Upload plugin artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-plugin
          path: dist/keyInterceptSelfHosted.tsx

  build-installer:
    runs-on: ${{ matrix.os }}
    needs: determine-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: cargo build --release -p key-intercept-installer

      - name: Package installer (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/key-intercept-installer dist/key-intercept-installer-linux-x86_64
          tar -C dist -czf dist/key-intercept-installer-linux-x86_64.tar.gz key-intercept-installer-linux-x86_64

      - name: Package installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/key-intercept-installer.exe dist/key-intercept-installer-windows-x86_64.exe
          Compress-Archive -Path dist/key-intercept-installer-windows-x86_64.exe -DestinationPath dist/key-intercept-installer-windows-x86_64.zip

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [determine-version, build-loopback-and-plugin, build-installer]
    steps:
      - name: Download installer packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
