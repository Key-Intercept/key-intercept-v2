name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_RELEASE_APK_NAME: key-intercept-loopback-android.apk
  IOS_RELEASE_IPA_NAME: key-intercept-loopback-ios.ipa

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      tag_created: ${{ steps.version.outputs.tag_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing_tag="$(git tag --points-at HEAD 'v*' | sort -V | tail -n1 || true)"
          if [[ -n "$existing_tag" ]]; then
            release_tag="$existing_tag"
            tag_created="false"
          else
            latest_tag="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="$(( ${BASH_REMATCH[3]} + 1 ))"
              release_tag="v${major}.${minor}.${patch}"
            else
              release_tag="v0.1.0"
            fi
            git tag "$release_tag"
            tag_created="true"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "tag_created=$tag_created" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.version.outputs.tag_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin "refs/tags/${RELEASE_TAG}"

  build-loopback-and-plugin:
    runs-on: ${{ matrix.os }}
    needs: determine-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            loopback_artifact_suffix: linux
          - os: windows-latest
            loopback_artifact_suffix: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build loopback server
        run: cargo build --release -p loopback-server

      - name: Collect loopback artifact (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/loopback-server dist/loopback-server

      - name: Upload loopback artifact (linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: loopback-server-${{ matrix.loopback_artifact_suffix }}-x86_64
          path: dist/loopback-server

      - name: Collect loopback artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/loopback-server.exe dist/loopback-server.exe

      - name: Upload loopback artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: loopback-server-${{ matrix.loopback_artifact_suffix }}-x86_64
          path: dist/loopback-server.exe

      - name: Collect plugin artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp plugin/keyInterceptSelfHosted.tsx dist/keyInterceptSelfHosted.tsx

      - name: Upload plugin artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-vencord-plugin
          path: dist/keyInterceptSelfHosted.tsx

  build-installer:
    runs-on: ${{ matrix.os }}
    needs: determine-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: cargo build --release -p key-intercept-installer

      - name: Package installer (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/key-intercept-installer dist/key-intercept-installer-linux-x86_64
          tar -C dist -czf dist/key-intercept-installer-linux-x86_64.tar.gz key-intercept-installer-linux-x86_64

      - name: Package installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/key-intercept-installer.exe dist/key-intercept-installer-windows-x86_64.exe
          Compress-Archive -Path dist/key-intercept-installer-windows-x86_64.exe -DestinationPath dist/key-intercept-installer-windows-x86_64.zip

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mobile-artifacts:
    runs-on: ${{ matrix.os }}
    needs: determine-version
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-latest
            target: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: mobile/android-loopback
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SHOULD_SIGN_APK=true
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_RELEASE_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_RELEASE_KEY_ALIAS}" ] || [ -z "${ANDROID_RELEASE_KEY_PASSWORD}" ]; then
            echo "Android signing secrets are missing. Building unsigned release APK." >&2
            SHOULD_SIGN_APK=false
          fi
          gradle :app:assembleRelease
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "${UNSIGNED_APK}" ]; then
            UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "${UNSIGNED_APK}" ]; then
            echo "Release APK not found after build." >&2
            exit 1
          fi
          mkdir -p ../../dist
          cp "${UNSIGNED_APK}" ../../dist/${ANDROID_RELEASE_APK_NAME}
          if [ "${SHOULD_SIGN_APK}" = "true" ]; then
            printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode --ignore-garbage > /tmp/key-intercept-release.jks
            BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)"
            APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
            if [ ! -x "${APKSIGNER}" ]; then
              echo "apksigner not found at ${APKSIGNER}" >&2
              exit 1
            fi
            "${APKSIGNER}" sign \
              --ks /tmp/key-intercept-release.jks \
              --ks-key-alias "${ANDROID_RELEASE_KEY_ALIAS}" \
              --ks-pass "pass:${ANDROID_RELEASE_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_RELEASE_KEY_PASSWORD}" \
              ../../dist/${ANDROID_RELEASE_APK_NAME}
            "${APKSIGNER}" verify ../../dist/${ANDROID_RELEASE_APK_NAME}
          else
            echo "Skipping APK signing."
          fi

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-loopback-android
          path: dist/${{ env.ANDROID_RELEASE_APK_NAME }}

      - name: Install XcodeGen
        if: matrix.target == 'ios'
        run: brew install xcodegen

      - name: Build iOS app
        if: matrix.target == 'ios'
        working-directory: mobile/ios-loopback
        run: |
          xcodegen generate
          xcodebuild \
            -project KeyInterceptLoopback.xcodeproj \
            -scheme KeyInterceptLoopback \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/KeyInterceptLoopback.xcarchive \
            archive
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/KeyInterceptLoopback.xcarchive/Products/Applications/KeyInterceptLoopback.app build/Payload/
          mkdir -p ../../dist
          (cd build && zip -qry ../../../dist/${IOS_RELEASE_IPA_NAME} Payload)

      - name: Upload iOS IPA
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: key-intercept-loopback-ios
          path: dist/${{ env.IOS_RELEASE_IPA_NAME }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [determine-version, build-loopback-and-plugin, build-installer, build-mobile-artifacts]
    steps:
      - name: Download installer packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Download loopback artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: loopback-server-*-x86_64
          merge-multiple: true
          path: release-assets

      - name: Download Vencord plugin artifact
        uses: actions/download-artifact@v4
        with:
          pattern: key-intercept-vencord-plugin
          merge-multiple: true
          path: release-assets

      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: key-intercept-loopback-*
          merge-multiple: true
          path: release-assets

      - name: Verify mobile release asset names
        run: |
          test -f "release-assets/${ANDROID_RELEASE_APK_NAME}"
          test -f "release-assets/${IOS_RELEASE_IPA_NAME}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
