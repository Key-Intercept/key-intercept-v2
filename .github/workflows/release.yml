name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag override (e.g. v1.2.3). Leave empty to auto-increment patch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ github.event.inputs.release_tag || '' }}"
          if [ -z "$release_tag" ]; then
            latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              release_tag="v0.1.0"
            else
              version="${latest_tag#v}"
              if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest tag '$latest_tag' is not semver (vMAJOR.MINOR.PATCH)" >&2
                exit 1
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              release_tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$release_tag' must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.version.outputs.release_tag }}"

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            echo "Tag ${release_tag} already exists locally"
          else
            git tag "${release_tag}" "${GITHUB_SHA}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists on origin"
          else
            git push origin "${release_tag}"
          fi

  build-loopback-and-plugin:
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build loopback server
        run: cargo build --release -p loopback-server

      - name: Package loopback and plugin assets (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loopback-server dist/loopback-server
          cp plugin/keyInterceptSelfHosted.tsx dist/keyInterceptSelfHosted.tsx
          (cd dist && zip -9 loopback-server-linux-x86_64.zip loopback-server)
          (cd dist && zip -9 key-intercept-plugin.zip keyInterceptSelfHosted.tsx)

      - name: Package loopback asset (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loopback-server dist/loopback-server
          (cd dist && zip -9 loopback-server-macos-x86_64.zip loopback-server)

      - name: Package loopback asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/loopback-server.exe dist/loopback-server.exe
          Compress-Archive -Path dist/loopback-server.exe -DestinationPath dist/loopback-server-windows-x86_64.zip -Force

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-loopback-${{ runner.os }}
          path: dist/*.zip

  build-installer:
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: cargo build --release -p key-intercept-installer

      - name: Package installer (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/key-intercept-installer dist/key-intercept-installer-linux-x86_64
          tar -C dist -czf dist/key-intercept-installer-linux-x86_64.tar.gz key-intercept-installer-linux-x86_64

      - name: Package installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path msix/Assets | Out-Null

          Copy-Item target/release/key-intercept-installer.exe dist/key-intercept-installer-windows-x86_64.exe
          Compress-Archive -Path dist/key-intercept-installer-windows-x86_64.exe -DestinationPath dist/key-intercept-installer-windows-x86_64.zip -Force

          Add-Type -AssemblyName System.Drawing
          $icon44 = New-Object System.Drawing.Bitmap 44,44
          $icon44Graphics = [System.Drawing.Graphics]::FromImage($icon44)
          $icon44Graphics.Clear([System.Drawing.Color]::FromArgb(0,120,212))
          $icon44.Save("msix/Assets/Square44x44Logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $icon44Graphics.Dispose()
          $icon44.Dispose()
          $icon150 = New-Object System.Drawing.Bitmap 150,150
          $icon150Graphics = [System.Drawing.Graphics]::FromImage($icon150)
          $icon150Graphics.Clear([System.Drawing.Color]::FromArgb(0,120,212))
          $icon150.Save("msix/Assets/Square150x150Logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $icon150Graphics.Dispose()
          $icon150.Dispose()

          Copy-Item target/release/key-intercept-installer.exe msix/key-intercept-installer.exe
          $version = "1.0.$env:GITHUB_RUN_NUMBER.0"
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package
            xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
            xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
            IgnorableNamespaces="uap rescap">
            <Identity Name="KeyIntercept.Installer" Publisher="CN=KeyIntercept" Version="$version" />
            <Properties>
              <DisplayName>Key Intercept Installer</DisplayName>
              <PublisherDisplayName>Key Intercept</PublisherDisplayName>
              <Description>Installs and configures key-intercept loopback and plugin.</Description>
              <Logo>Assets\Square44x44Logo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22631.0" />
            </Dependencies>
            <Applications>
              <Application Id="KeyInterceptInstaller" Executable="key-intercept-installer.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements
                  DisplayName="Key Intercept Installer"
                  Description="Key Intercept Installer"
                  BackgroundColor="transparent"
                  Square44x44Logo="Assets\Square44x44Logo.png"
                  Square150x150Logo="Assets\Square150x150Logo.png" />
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@ | Set-Content -Path msix/AppxManifest.xml -Encoding utf8
          makeappx pack /d msix /p dist/key-intercept-installer-windows-x86_64.msix /o

      - name: Upload installer assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-installer-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msix

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-loopback-and-plugin, build-installer]
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
