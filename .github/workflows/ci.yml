name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test -p loopback-server -p relay-server -p key-intercept-installer

      - name: Run Rust checks
        run: cargo check -p loopback-server -p relay-server -p key-intercept-installer

      - name: Run plugin tests
        run: npm --prefix plugin test
